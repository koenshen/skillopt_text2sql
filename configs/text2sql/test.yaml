_base_: default.yaml

# Small two-epoch end-to-end run: fixed 10-question Real Dev Gate.
train:
  num_epochs: 2
  train_size: 10
  batch_size: 2
  accumulation: 2

gradient:
  analyst_workers: 4
  minibatch_size: 2
  merge_batch_size: 5

optimizer:
  learning_rate: 2
  min_learning_rate: 1
  lr_scheduler: constant
  use_slow_update: false
  use_meta_skill: false

evaluation:
  sel_env_num: 10
  eval_test: false

env:
  workers: 4
