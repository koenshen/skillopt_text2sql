_base_: ../_base_/default.yaml

train:
  num_epochs: 2
  train_size: 1000
  batch_size: 40
  accumulation: 2

gradient:
  analyst_workers: 4
  minibatch_size: 8
  merge_batch_size: 8

optimizer:
  # Keep epoch-wise slow updates subject to the same Dev Gate as normal edits.
  slow_update_gate_with_selection: true

evaluation:
  use_gate: true
  gate_metric: hard
  sel_env_num: 200
  eval_test: false

env:
  name: text2sql
  skill_init: skillopt/envs/text2sql/skills/initial.md
  split_mode: split_dir
  split_dir: data/bird_text2sql
  split_seed: 42
  workers: 4
  execution_timeout: 30
  # These names select two entries from repository-root model_config.yaml.
  # Target Agent: runs the complete tool-calling workflow and produces SQL.
  agent_model_config_name: Qwen3.6-27B-no-think
  # SkillOpt Optimizer: analyzes trajectories and updates the skill.
  optimizer_model_config_name: Qwen3.6-27B-no-think
